<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CoinStats Portfolio Widget</title>
  <script async src="https://static.coinstats.app/widgets/portfolio-widget.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Calibri, sans-serif;
    }
  </style>
</head>
<body>
  <coin-stats-portfolio-widget
    locale="en"
    currency="USD"
    bg-color="rgba(0,0,0,1)"
    status-up-color="rgba(0,255,192,1)"
    status-down-color="rgba(255,0,0,1)"
    text-color="rgba(255,255,255,1)"
    border-color="rgba(0,255,210,1)"
    widgetType="large"
    coins-count="10"
    font="Calibri"
    link="biXIq5WyY8I7alP"
    rotate-button-color="rgba(255, 255, 255, 0.35)"
    width="486">
  </coin-stats-portfolio-widget>
</body>
</html>
