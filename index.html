<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>CoinStats Widget</title>
    <script async src="https://static.coinstats.app/widgets/portfolio-widget.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000000;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      /* Wrapper with fixed height to ensure widget displays */
      .widget-wrapper {
        width: 100%;
        max-width: 500px;
        height: 365px;        /* fixed height ensures widget loads */
        overflow: hidden;      /* hide scrollbars */
        position: relative;
      }

      /* Container fills wrapper */
      .widget-container {
        width: 100%;
        height: 100%;
      }

      /* CoinStats widget styling */
      coin-stats-portfolio-widget {
        display: block;
        width: 100%;
        height: 100%;
        background-color: #000000 !important;
        border: none !important;     
        box-shadow: none !important; 
        outline: none !important;    
      }

      /* Optional: slightly scale down for smaller screens */
      @media (max-width: 400px) {
        .widget-wrapper {
          height: 300px;       /* smaller height on mobile */
        }
      }
    </style>
  </head>
  <body>
    <div class="widget-wrapper">
      <div class="widget-container">
        <coin-stats-portfolio-widget 
          locale="en" 
          currency="PHP" 
          bg-color="#000000" 
          status-up-color="#74D492" 
          status-down-color="#FE4747" 
          text-color="#FFFFFF" 
          border-color="transparent"
          widgetType="large" 
          coins-count="10" 
          font="Calibri" 
          link="biXIq5WyY8I7alP" 
          rotate-button-color="rgba(255, 255, 255, 0.35)" 
          width="100%">
        </coin-stats-portfolio-widget>
      </div>
    </div>
  </body>
</html>
