<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>CoinStats Widget</title>
    <script async src="https://static.coinstats.app/widgets/portfolio-widget.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #000000;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      /* Responsive wrapper keeps aspect ratio and hides overflow */
      .widget-wrapper {
        width: 100%;
        max-width: 500px;        
        position: relative;
        padding-bottom: 65%;      
        overflow: hidden;          
      }

      /* Container fills wrapper and scales widget */
      .widget-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform-origin: top left;
        transform: scale(1);       
      }

      coin-stats-portfolio-widget {
        display: block;
        width: 100%;
        height: 100%;
        background-color: #000000 !important;
        border: none !important;      /* remove any border */
        box-shadow: none !important;  /* remove any shadow */
        outline: none !important;     /* remove any outline on focus/hover */
      }
    </style>
  </head>
  <body>
    <div class="widget-wrapper">
      <div class="widget-container">
        <coin-stats-portfolio-widget 
          locale="en" 
          currency="PHP" 
          bg-color="#000000" 
          status-up-color="#74D492" 
          status-down-color="#FE4747" 
          text-color="#FFFFFF" 
          border-color="transparent"   <!-- removes widget border -->
          widgetType="large" 
          coins-count="10" 
          font="Calibri" 
          link="biXIq5WyY8I7alP" 
          rotate-button-color="rgba(255, 255, 255, 0.35)" 
          width="100%">
        </coin-stats-portfolio-widget>
      </div>
    </div>
  </body>
</html>
