        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      /* Responsive wrapper keeps aspect ratio and hides overflow */
      .widget-wrapper {
        width: 100%;
        max-width: 500px;          /* optional max width */
        position: relative;
        padding-bottom: 65%;       /* controls height relative to width */
        overflow: hidden;           /* removes scrollbars */
      }

      /* Container fills wrapper and scales widget */
      .widget-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        transform-origin: top left;
        transform: scale(1);        /* adjust if widget needs tiny shrink */
      }

      coin-stats-portfolio-widget {
        display: block;
        width: 100%;
        height: 100%;
        background-color: #000000 !important;
      }
    </style>
