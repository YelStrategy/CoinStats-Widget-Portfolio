<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CoinStats Portfolio Widget</title>
  <style>
    body, html { margin:0; padding:0; }
    #widget-container {
      position: relative;
      max-width: 500px;
      margin: 0 auto;
      padding-bottom: 120%;
      height: 0;
      overflow: hidden;
    }
    #widget-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="widget-container">
    <iframe 
      src="https://coinstats.app/widgets/portfolio-widget?portfolio=biXIq5WyY8I7alP" 
      scrolling="no">
    </iframe>
  </div>
</body>
</html>
