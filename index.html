<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CoinStats Widget</title>
    <script async src="https://static.coinstats.app/widgets/portfolio-widget.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #000000;
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }

      coin-stats-portfolio-widget {
        display: block;
        background-color: #000000 !important;
        border: none !important;
        box-shadow: none !important;
        outline: none !important;
      }
    </style>
  </head>
  <body>
    <coin-stats-portfolio-widget
      locale="en"
      currency="PHP"
      bg-color="#000000"
      status-up-color="#74D492"
      status-down-color="#FE4747"
      text-color="#FFFFFF"
      border-color="transparent"
      widgetType="large"
      coins-count="10"
      font="Calibri"
      link="biXIq5WyY8I7alP"
      rotate-button-color="rgba(255, 255, 255, 0.35)">
    </coin-stats-portfolio-widget>
  </body>
</html>
